receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 1s

connectors:
  # Deriva contadores e histogramas dos spans; adequado para tendências e alertas de CI/CD.
  spanmetrics:
    histogram:
      explicit:
        # Esteiras têm granularidade de segundos/minutos, não de chamadas HTTP.
        buckets: [100ms, 1s, 5s, 15s, 30s, 35s, 40s, 45s, 50s, 60s, 120s, 300s, 600s]
    dimensions:
      - name: cicd.pipeline.name
      - name: cicd.pipeline.result
    exclude_dimensions: [collector.instance.id]
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    metrics_flush_interval: 5s
    resource_metrics_key_attributes: [service.name, service.namespace, cicd.platform]

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: false
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki, debug]
